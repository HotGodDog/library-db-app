[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "library-db-app"
version = "0.1.0"
description = "Web application for library management system"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "mkdocs>=1.5.0",
]

[project.urls]
Repository = "https://github.com/HotGodDog/library-db-app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["csv/*.csv"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# --- coverage ---
[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]